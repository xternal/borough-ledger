name: Alpha

# The Alpha is a private copy of the site for trying it out: the `alpha` branch, kept on the latest main.
# Vercel builds every push to it as a preview: test data visibly marked, kept out of search engines,
# behind Vercel login unless shared. Never commit to `alpha` directly; this job overwrites it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha
  cancel-in-progress: true

jobs:
  alpha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Vercel does not deploy a commit it has already built for main, so the Alpha gets a new, empty commit on top
      # of main, credited to whoever made the latest change (a Hobby team only deploys its own members' commits).
      - name: Move alpha to the latest main
        run: |
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
          git checkout -B alpha
          git commit --allow-empty -m "Alpha: main at ${GITHUB_SHA::7}"
          git push --force origin alpha
