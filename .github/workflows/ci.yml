name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  etl:
    name: ETL (sources, checks, build up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download sources and verify their SHA-256
        run: python etl/fetch.py
      - name: ETL unit tests
        run: python -m unittest discover -s etl/tests -t .
      - name: Every check passes and data/build matches a fresh build
        run: python etl/build.py --check

  content:
    name: Content (promises, councillors, append-only history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Every file parses, every cross-check passes, content.json is up to date
        run: pnpm --filter @borough-ledger/schema content:check
      - name: Promise history only grows (CLAUDE.md invariant 8)
        run: pnpm --filter @borough-ledger/schema content:append-only origin/main

  check:
    name: Typecheck, test, preview build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Preview build (test data allowed, visibly marked)
        run: pnpm build:preview
      - name: No middle dots in source or built pages
        run: pnpm check:dots
      - name: Every promise card has its own share image
        run: pnpm check:share-images
      - name: List remaining test values
        run: pnpm --filter @borough-ledger/schema report:test-values

  production-gate:
    # CLAUDE.md invariant 1: a production build must fail while any rendered value has quality "test".
    # This job proves it: with test data present, build:prod must fail on the test-data error;
    # with none left, build:prod must pass. Vercel production deploys run the same build:prod.
    name: Production build gate
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/ci-production-gate.sh
