name: Reminders

# Jobs only a person can do, or start, opened as issues on the day they fall due (GitHub emails the owner about new
# issues). The list and its dates are in scripts/reminders.py: the council's spend file each quarter, the new budget in
# March, the yearly government data, the pledge audit, the domain, Node, legal advice before 2030, and a week after
# each council's election in data/config/boroughs.json.
on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC: 09:00 BST in summer, 08:00 GMT in winter
  workflow_dispatch:
    inputs:
      which:
        description: "Open this reminder now, or check what is due today"
        type: choice
        default: due-today
        options:
          - due-today
          - spend-file
          - budget
          - council-tax-year
          - budget-returns
          - care-autumn
          - care-winter
          - pledge-audit
          - council-year
          - budget-cycle
          - domain
          - node-24
          - legal-2030

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Open the reminders that are due, unless already opened
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WHICH: ${{ inputs.which || 'due-today' }}
        run: |
          if [ "$WHICH" = "due-today" ]; then
            python3 scripts/reminders.py
          else
            python3 scripts/reminders.py --open "$WHICH"
          fi
