name: Weekly digest draft

# Sunday evenings: a draft Substack post for Monday about the past week at the council and what is coming up (Cabinet
# usually meets on Mondays), written by Claude
# from facts the site already holds (packages/schema/src/digest-cli.ts), every number checked against them. It opens
# as an issue (GitHub emails the owner), with the facts underneath, for the owner to edit and post.
on:
  schedule:
    - cron: "0 17 * * 0" # 17:00 UTC on Sundays: 18:00 BST in summer, 17:00 GMT in winter; edit in the evening, post on Monday
  workflow_dispatch:
    inputs:
      date:
        description: "Week ending (YYYY-MM-DD); today if empty"
        required: false

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 100 # enough history to see whether new spend data arrived this week
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write the draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm --filter @borough-ledger/schema digest "$RUNNER_TEMP/digest.md" ${{ inputs.date }}
      - name: Open it as an issue, once per week
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WEEK: ${{ inputs.date }}
        run: |
          week="${WEEK:-$(TZ=Europe/London date +%F)}"
          # A Sunday run is the draft for the next day's post.
          if [ "$(date -d "$week" +%u)" = "7" ]; then day=$(date -d "$week + 1 day" +%F); else day="$week"; fi
          title="Weekly digest draft for $(date -d "$day" '+%A %-d %B %Y')"
          gh label create digest --repo "$REPO" --color 2457f5 --description "Weekly Substack draft" --force >/dev/null
          if gh issue list --repo "$REPO" --state all --label digest --search "\"$title\" in:title" --json number --jq '.[0].number' | grep -q .; then
            echo "Already opened: $title"
          else
            gh issue create --repo "$REPO" --title "$title" --label digest --body-file "$RUNNER_TEMP/digest.md"
          fi
